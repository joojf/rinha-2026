services:
  api1:
    image: ghcr.io/joojf/rinha-2026:latest
    pull_policy: always
    environment:
      - LISTEN_UDS=/sockets/api1.sock
    volumes:
      - sockets:/sockets
    networks:
      - backend
    security_opt:
      - seccomp=unconfined
    deploy:
      resources:
        limits:
          cpus: "0.30"
          memory: 165MB
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

  api2:
    image: ghcr.io/joojf/rinha-2026:latest
    pull_policy: always
    environment:
      - LISTEN_UDS=/sockets/api2.sock
    volumes:
      - sockets:/sockets
    networks:
      - backend
    security_opt:
      - seccomp=unconfined
    deploy:
      resources:
        limits:
          cpus: "0.30"
          memory: 165MB
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

  lb:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - sockets:/sockets
    ports:
      - "9999:9999"
    depends_on:
      - api1
      - api2
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: 20MB
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    sysctls:
      net.core.somaxconn: 4096

volumes:
  sockets:

networks:
  backend:
    driver: bridge
